name: Automated Civ4 DLL Build

on:
  push:
    branches:
      - 'dll-build'
      - 'dll-build-debug'
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  NODE_SKIP_PLATFORM_CHECK: '1'
  ACTIONS_RUNNER_HOOK_DISABLE_AUTOUPDATE: 'true'

jobs:
  build-dll:
    runs-on: self-hosted # Use local virtual machine for building
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Build DLL via MSBuild
      shell: powershell
      run: |
        # Set configuration based on current active branch
        $config = "Release"
        # NOTE: Fixed branch name to match the trigger ('dll-build-debug', not 'dll-debug-build')
        if ("${{ github.ref_name }}" -eq "dll-build-debug") {
            $config = "Debug"
        }
        Write-Output "Targeting configuration: $config"
        
        # Sync the repository's files into the RAM disk workspace
        # (Using Get-ChildItem is more reliable than Move-Item -Path ".*")
        Get-ChildItem -Path "." -Exclude @("Project",".git") | Move-Item -Destination "R:\CvGameCoreDLL\" -Force
        
        $vcvarsall = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\vcvarsall.bat"
        $projectDir = "R:\CvGameCoreDLL\Project"
        
        # Run vcvarsall, change directory, and build all in ONE cmd session.
        # No need to import env vars into PowerShell.
        $buildCmd = "call `"$vcvarsall`" x86 && cd /d `"$projectDir`" && msbuild AdvCiv.vcxproj /p:Configuration=$config"
        cmd.exe /c $buildCmd
        
        if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild compilation process encountered errors."
            exit $LASTEXITCODE
        }

    - name: Upload Compiled DLL Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      
      with:
        name: CvGameCoreDLL-${{ github.ref_name }}-${{ github.sha }}
        path: |
          R:\CvGameCoreDLL/Project/Release/CvGameCoreDLL.dll
          R:\CvGameCoreDLL/Project/Debug/CvGameCoreDLL.dll
        if-no-files-found: error

    - name: Clean Up RAM Disk Build Files
      if: always()
      
      shell: powershell
      run: |
        Write-Output "Scrubbing workspace build artifacts..."
        Set-Location "R:\CvGameCoreDLL"
        
        # Clean intermediate directories to preserve space on the RAM disk
        $cleanupDirs = @("Project/Release", "Project/Debug", "Project/temp_files", "Project/objs")
        foreach ($dir in $cleanupDirs) {
            if (Test-Path $dir) {
                Remove-Item -Path $dir -Recurse -Force
                Write-Output "Successfully wiped: $dir"
            }
        }

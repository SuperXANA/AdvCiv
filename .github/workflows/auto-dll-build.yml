name: Automated Civ4 DLL Build

on:
  push:
    branches:
      - 'dll-build'
      - 'dll-build-debug'

jobs:
  build-dll:
    runs-on: self-hosted # Use local virtual machine for building
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Build DLL via MSBuild
      shell: bash
      run: |
          # Set configuration based on current active branch (Using standard Bash syntax)
          CONFIG="Release"
          if [ "dll-build" = "dll-build-debug" ]; then
              CONFIG="Debug"
          fi
          echo "Targeting configuration: $CONFIG"
          
          # Sync the repository's files into the RAM disk workspace
          #rsync -avz --include='*/' --include='*.cpp' --include='*.h' --include='*.c' --exclude='*' ./ Administrator@192.168.2.252:"/cygdrive/r/cvgamecoredll"

          # Use Cygwin POSIX path style for navigating inside Bash
          VC_VARS='/cygdrive/c/program files (x86)\microsoft visual studio 10.0\vc\vcvarsall.bat'
          PROJECT_DIR='/cygdrive/r/CvGameCoreDLL/Project'

          # Construct a pure Bash command execution chain
          BUILD_CMD="cd \"$PROJECT_DIR\" && cmd.exe /c \"call "$VC_VARS" x86 && msbuild AdvCiv.vcxproj /p:Configuration=$CONFIG\""
          
          # Connect to local virtual machine and start the build remotely
          ssh Administrator@192.168.2.252 "$BUILD_CMD"

    - name: Copy DLL files Over To Linux
      shell: bash
      run: |
        # Set configuration based on current active branch
        CONFIG="Release"
        if [ "${{ github.ref_name }}" = "dll-build-debug" ]; then
            CONFIG="Debug"
        # Copy files so upload-artifact can upload them
        scp Administrator@192.168.2.252:/R:/CvGameCoreDLL/Project/$CONFIG/*.dll ./
        if [ "${{ github.ref_name }}" = "dll-build-debug" ]; then
            scp Administrator@192.168.2.252:/R:/CvGameCoreDLL/Project/$CONFIG/*.pdb ./

    - name: Upload Compiled DLL Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      
      with:
        name: CvGameCoreDLL-${{ github.ref_name }}-${{ github.sha }}
        path: |
          ./CvGameCoreDLL.dll
        if-no-files-found: error

    - name: Clean Up RAM Disk Build Files
      if: always()
      
      shell: bash
      env:
          # YAML automatically preserves this multi-line string exactly as written
          PS_CODE: |
            Write-Output "Scrubbing workspace build artifacts..."
            Set-Location "R:\CvGameCoreDLL"
            $cleanupDirs = @("Project/Release", "Project/Debug", "Project/temp_files", "Project/objs")
            foreach ($dir in $cleanupDirs) {
              if (Test-Path $dir) {
                Remove-Item -Path $dir -Recurse -Force
                Write-Output "Successfully wiped: $dir"
              }
            }
      run: |
          # Encode the command for PowerShell
          ENCODED_SCRIPT=$(echo -n "$PS_CODE" | iconv -t UTF-16LE | base64 -w 0)
          
          # Execute remotely over SSH
          ssh Administrator@192.168.2.252 "powershell -EncodedCommand $ENCODED_SCRIPT"

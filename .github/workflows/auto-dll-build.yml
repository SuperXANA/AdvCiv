name: Automated Civ4 DLL Build

# Strictly limit GitHub Token privileges. 
# This strips away all default write access except for what is explicitly defined here.
permissions:
  contents: read
  actions: write

on:
  push:
    branches-ignore:
      - dll-build
    paths: ["CvGameCoreDLL/**", ".github/workflows/auto-dll-build.yml"]
  workflow_dispatch:
  
concurrency:
  group: civ4-dll-chatgpt-workspace
  cancel-in-progress: false

jobs:
  build-dll:
    runs-on: civ4-dll-build # Use local virtual machine for building
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        configuration: [Release, Debug]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Build DLL via MSBuild
      id: build
      shell: bash
      env:  
          # YAML automatically preserves this string exactly as written
          # add pinned-1.14 commit SHA here
          BASE_COMMIT_SHA: 5970334b64a875b5cdb370c94fc9a98db4eacda6
          
          # YAML automatically preserves this string exactly as written
          # add feature commit SHA here
          FEATURE_COMMIT_SHA: 0e6c8622c4dc219196fa9afd79a5046ca2f811f5
          
          # YAML automatically preserves this string exactly as written
          # add workflow commit SHA here
          WORKFLOW_COMMIT_SHA: f77f8a67cd17fdfa9d1c3f443d49005cee04421e
          
          # YAML automatically preserves this multi-line string exactly as written
          PS_CODE: |
            param(
              [string]$cfg
            )
            $ErrorActionPreference = "Stop"
            $sourceRoot = "R:\CvGameCoreDLL"
            # Preserve the VM's Project configuration and force fresh build outputs.
            $projectDir = "$sourceRoot\Project"
            foreach ($dir in @("Release", "Debug", "temp_files", "obj")) {
              $outputDir = Join-Path $projectDir $dir
              if (Test-Path $outputDir) { Remove-Item $outputDir -Recurse -Force }
            }
            # Remove existing MSBuild logs to protect against uploading older log files - especially when evaluating failing builds
            foreach ($logName in @("Build.log", "JustErrors.log", "JustWarnings.log", "BuildTiming.log")) {
              $logPath = Join-Path $projectDir $logName
              if (Test-Path -LiteralPath $logPath) { Remove-Item -LiteralPath $logPath -Force }
            }
            # Correlate failure logs with this exact invocation, including reruns.
            Set-Content -LiteralPath (Join-Path $projectDir "codex-build-log-token.txt") -Encoding ASCII '${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.configuration }}-${{ github.sha }}'
            # rsync preserves runner timestamps; the VM clock can lag behind it.
            # Fresh outputs are already removed, so source-only mtime normalization
            # cannot hide stale objects and does not change verified file contents.
            $precompileSource = Get-Item -LiteralPath (Join-Path $sourceRoot "_precompile.cpp")
            $sourceStamp = [DateTime]::UtcNow.AddSeconds(-2)
            $timingLog = Join-Path $projectDir "BuildTiming.log"
            @(
              ("vm_utc_before=" + [DateTime]::UtcNow.ToString("o")),
              ("precompile_utc_before=" + $precompileSource.LastWriteTimeUtc.ToString("o")),
              ("normalized_source_utc=" + $sourceStamp.ToString("o"))
            ) | Set-Content -LiteralPath $timingLog -Encoding ASCII
            $sourceExtensions = @(".c", ".cpp", ".h", ".inl")
            foreach ($sourceFile in @(Get-ChildItem -LiteralPath $sourceRoot -Force | Where-Object { -not $_.PSIsContainer -and $sourceExtensions -contains $_.Extension.ToLowerInvariant() })) {
              $sourceFile.LastWriteTimeUtc = $sourceStamp
            }
            Add-Content -LiteralPath $timingLog -Encoding ASCII ("precompile_utc_after=" + (Get-Item -LiteralPath $precompileSource.FullName).LastWriteTimeUtc.ToString("o"))
            # Check the compiler selected by the machine-local Makefile.user.
            # The VS2010 shell only hosts MSBuild; game code must use VC7.1.
            $probeSource = Join-Path $projectDir "codex-toolset-check.cpp"
            $probeMake = Join-Path $projectDir "codex-toolset-check.mk"
            Set-Content -Encoding ASCII $probeSource @(
              "#if _MSC_VER != 1310",
              "#error Civ4 DLL validation requires MSVC 7.1 (_MSC_VER 1310)",
              "#endif",
              "int codex_toolset_check;"
            )
            $probeLines = "!include Makefile`r`ncodex_compiler_check:`r`n`t" + '@$(CPP) /nologo /c /TP /Focodex-toolset-check.obj codex-toolset-check.cpp' + "`r`n"
            Set-Content -Encoding ASCII $probeMake $probeLines
            # Set configuration based on current active branch
            Write-Output "Targeting configuration: $cfg"
            $vcvarsall = "C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\vcvarsall.bat"
            $projectDir = "R:\CvGameCoreDLL\Project"
            # Run vcvarsall, change directory, and build all in ONE cmd session.
            # No need to import env vars into PowerShell.
            $buildCmd = "call `"$vcvarsall`" x86 && cd /d `"$projectDir`" && nmake /f codex-toolset-check.mk TARGET=$cfg codex_compiler_check /NOLOGO && msbuild AdvCiv.vcxproj /p:Configuration=$cfg -t:Rebuild -fl1 -flp1:logfile=Build.log -fl2 -fl3 -flp2:logfile=JustErrors.log;errorsonly -flp3:logfile=JustWarnings.log"
            try {
              cmd.exe /c $buildCmd
              $buildExit = $LASTEXITCODE
            } finally {
              Remove-Item $probeSource, $probeMake, (Join-Path $projectDir "codex-toolset-check.obj") -Force -ErrorAction SilentlyContinue
            }
            if ($buildExit -ne 0) {
              Write-Error "MSBuild compilation process encountered errors."
              exit $buildExit
            }
            Write-Output "Verified selected compiler: _MSC_VER == 1310 (MSVC 7.1)." 
          
          # YAML automatically preserves this multi-line string exactly as written
          HASH_SCRIPT: |
            $ErrorActionPreference = 'Stop'
            Set-StrictMode -Version 2.0
            try {
              [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding
              if ($PSVersionTable.PSVersion.Major -lt 4) {
                throw 'Source verification requires Windows PowerShell 4.0 or newer.'
              }
              $root = 'R:\CvGameCoreDLL'
              $extensions = @('.cpp', '.h', '.inl', '.c')
              $files = @(Get-ChildItem -LiteralPath $root -Force | Where-Object { -not $_.PSIsContainer -and $extensions -contains $_.Extension.ToLowerInvariant() })
              if ($files.Count -eq 0) {
                throw 'No root source files found on the Windows builder.'
              }
              foreach ($file in $files) {
                if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw ('Source reparse point is not permitted: ' + $file.FullName)
                }
                if ($file.Name -match '[\r\n\\]') {
                  throw ('Unsupported source path: ' + $file.FullName)
                }
                $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
                # Match GNU sha256sum's text record, not its formatted PowerShell table.
                [Console]::WriteLine(('{0}  ./{1}' -f $hash.ToLowerInvariant(), $file.Name))
              }
              exit 0
            } catch {
              [Console]::Error.WriteLine($_.Exception.Message)
              exit 1
            }
      run: |
          set -euo pipefail
          # Set configuration based on matrix (Using standard Bash syntax)
          CONFIG="${{ matrix.configuration }}"
          
          # Delete stale top-level source files only. Excluded directories and
          # machine-local Project files are protected from this delete pass.
          rsync -avz --checksum --delete --blocking-io \
          -e "ssh -o IPQoS=throughput" \
          --include='/*.cpp' --include='/*.h' --include='/*.inl' --include='/*.c' \
          --exclude='/*' \
          ./CvGameCoreDLL/ Administrator@192.168.2.252:"/cygdrive/r/cvgamecoredll"

          # Sync the complete pinned-base-plus-feature source overlay into the Windows Server's RAM Disk workspace.
          rsync -avz --checksum --blocking-io \
          -e "ssh -o IPQoS=throughput" \
          --exclude='/Project/*' \
          --exclude='/.git/*' \
          --exclude='/.github/*' \
          --include='*/' --include='*' --include='*.cpp' --include='*.h' --include='*.inl' --include='*.c' --exclude='*/' --exclude='*' \
          ./CvGameCoreDLL/ Administrator@192.168.2.252:"/cygdrive/r/cvgamecoredll"

          # Enable sha256sum hashing of DLL sources
          # Hash the same root source scope as the existing filename-only check.
          # Run after rsync, but before invoking the compiler.
          # Prerequisite: the enclosing workflow already uses set -euo pipefail.
          rm -f expected-sources.txt actual-sources.txt source-hashes.diff \
            source-verification.txt build-provenance.txt
          printf '%s\n' 'scope=root:.c,.cpp,.h,.inl' 'algorithm=SHA256' \
            'status=collecting' > source-verification.txt
          echo 'source_verification_started=true' >> "$GITHUB_OUTPUT"

          (
            cd CvGameCoreDLL
            # Include symlinks in discovery so they cannot silently evade verification.
            find . -maxdepth 1 \( -type f -o -type l \) \
            \( -iname '*.cpp' -o -iname '*.h' -o -iname '*.inl' -o -iname '*.c' \) \
            -print0 |
            while IFS= read -r -d '' file; do
              if [[ -L "$file" || "$file" == *$'\n'* || "$file" == *$'\r'* || "$file" == *\\* ]]; then
                printf 'Unsupported source path: %q\n' "$file" >&2
                exit 1
              fi
              sha256sum -- "$file"
              done
          ) | LC_ALL=C sort -k2 > expected-sources.txt

          test -s expected-sources.txt
          
          # Encode the command for PowerShell
          ENCODED_SCRIPT_FOR_HASH_CALCULATION=$(echo -n "$HASH_SCRIPT" | iconv -t UTF-16LE | base64 -w 0)

          # Enumerate and hash the Windows files independently. Only the MANIFEST's CR characters are removed; source bytes are never altered.
          ssh -o IPQoS=throughput Administrator@192.168.2.252 \
          "powershell.exe -EncodedCommand $ENCODED_SCRIPT_FOR_HASH_CALCULATION" \
          | tr -d '\r' | LC_ALL=C sort -k2 > actual-sources.txt

          test -s actual-sources.txt
          if ! diff -u expected-sources.txt actual-sources.txt > source-hashes.diff; then
            printf '%s\n' 'status=failed' >> source-verification.txt
            cat source-hashes.diff
            echo '::error::Windows source names or SHA-256 hashes differ; build refused.'
            exit 1
          fi
          printf '%s\n' 'status=passed' >> source-verification.txt
          # Add commit hashes to build provenence log file
          printf '%s\n' "commit=${{ github.sha }}" "configuration=$CONFIG" "compiler=_MSC_VER_1310" "base=$BASE_COMMIT_SHA" "feature_source=$FEATURE_COMMIT_SHA" "workflow_source=$WORKFLOW_COMMIT_SHA" > build-provenance.txt

          # Add hash verification to build provenance
          {
            printf '%s\n' 'source_hash_algorithm=SHA256' \
            'source_scope=root:.c,.cpp,.h,.inl' \
            'source_manifest_format=sha256sum-v1' 'source_hash_verification=passed'
            printf 'expected_sources_manifest_sha256=%s\n' \
            "$(sha256sum expected-sources.txt | cut -d ' ' -f 1)"
            printf 'actual_sources_manifest_sha256=%s\n' \
            "$(sha256sum actual-sources.txt | cut -d ' ' -f 1)"
          } >> build-provenance.txt
          
          # Encode the command for PowerShell
          ENCODED_SCRIPT=$(echo -n "$PS_CODE" | iconv -t UTF-16LE | base64 -w 0)
          # Cleanup is allowed only after we have entered the build invocation.
          echo "build_started=true" >> "$GITHUB_OUTPUT"
          
          # Connect to local Windows Server builder virtual machine and start the build remotely
          ssh Administrator@192.168.2.252 "powershell.exe -Command \"& ([scriptblock]::Create([System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String('$ENCODED_SCRIPT')))) -cfg '$CONFIG'\""
     
    - name: Copy Build Log files Over To Linux
      if: ${{ always() && steps.build.outputs.build_started == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Set configuration based on matrix
        CONFIG="${{ matrix.configuration }}"
        
        # Copy files so upload-artifact can upload them
        mkdir -p artifacts
        rm -f ./artifacts/*.log
        
        EXPECTED_LOG_TOKEN='${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.configuration }}-${{ github.sha }}'
        REMOTE_LOG_TOKEN=$(ssh -o IPQoS=throughput Administrator@192.168.2.252 \
          'cat /cygdrive/r/cvgamecoredll/project/codex-build-log-token.txt' | tr -d '\r\n')
        if [ "$REMOTE_LOG_TOKEN" != "$EXPECTED_LOG_TOKEN" ]; then
          echo '::error::Current build log token is missing or mismatched; refusing stale logs.'
          exit 1
        fi
        
        # Get the build log that MSBUild created - local build with updated msbuild cmd verified that these were created in source R:/CvGameCoreDLL/Project
        for LOG in Build.log JustErrors.log JustWarnings.log BuildTiming.log; do
          if ! scp "Administrator@192.168.2.252:/cygdrive/r/cvgamecoredll/project/$LOG" ./artifacts/; then
            echo "::warning::No current $LOG could be copied."
          fi
        done
        test -s ./artifacts/Build.log

    - name: Upload Build Artifacts Always on Failure
      if: ${{ always() && steps.build.outcome == 'failure' && steps.build.outputs.build_started == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: compilation-failure-artifacts-${{ matrix.configuration }}-${{ github.ref_name }}-${{ github.sha }}
        path: |
          ./artifacts/*.log
        if-no-files-found: error
    
    # this always-run upload contains diagnostics, not binaries
    - name: Upload Source Verification Diagnostics
      if: ${{ always() && steps.build.outputs.source_verification_started == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: source-verification-${{ matrix.configuration }}-${{ github.ref_name }}-${{ github.sha }}
        path: |
          ./expected-sources.txt
          ./actual-sources.txt
          ./source-hashes.diff
          ./source-verification.txt
          ./build-provenance.txt
        if-no-files-found: error
        
    - name: Copy DLL files Over To Linux
      id: copy_dll
      if: ${{ always() && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        # Set configuration based on matrix
        CONFIG="${{ matrix.configuration }}"
        
        # Copy files so upload-artifact can upload them
        mkdir -p artifacts

        # Remove earlier local binaries before starting a new transfer.
        rm -f ./artifacts/CvGameCoreDLL.dll ./artifacts/CvGameCoreDLL.pdb
        
        # Get the game DLL file - known-working source location
        scp Administrator@192.168.2.252:/cygdrive/r/cvgamecoredll/project/$CONFIG/CvGameCoreDLL.dll ./artifacts/CvGameCoreDLL.dll
        # Get the PDB file if this is a Debug build - known-working source location
        if [ "$CONFIG" = "Debug" ]; then
          scp Administrator@192.168.2.252:/cygdrive/r/cvgamecoredll/project/temp_files/$CONFIG/CvGameCoreDLL.pdb ./artifacts/CvGameCoreDLL.pdb
          test -s ./artifacts/CvGameCoreDLL.pdb
        fi
        
        test -s ./artifacts/CvGameCoreDLL.dll
        
    - name: Upload Compiled DLL Artifact
      if: ${{ always() && steps.copy_dll.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      
      with:
        name: CvGameCoreDLL-${{ matrix.configuration }}-${{ github.ref_name }}-${{ github.sha }}
        path: |
          ./artifacts/CvGameCoreDLL.dll
          ./artifacts/CvGameCoreDLL.pdb
          ./artifacts/*.log
        if-no-files-found: error

    - name: Clean Up RAM Disk Build Files
      if: ${{ always() && steps.build.outputs.build_started == 'true' }}
      
      shell: bash
      env:
          # YAML automatically preserves this multi-line string exactly as written
          PS_CODE: |
            $ErrorActionPreference = "Stop"
            Write-Output "Scrubbing workspace build artifacts..."
            Set-Location "R:\CvGameCoreDLL\Project"
            $cleanupDirs = @("Release", "Debug", "temp_files", "obj")
            foreach ($dir in $cleanupDirs) {
              if (Test-Path $dir) {
                Remove-Item -Path $dir -Recurse -Force
                Write-Output "Successfully wiped: $dir"
              }
            }
            $logToken = "codex-build-log-token.txt"
            Remove-Item -LiteralPath "R:\CvGameCoreDLL\Project\$logToken" -Force -ErrorAction SilentlyContinue
            Write-Output "Successfully wiped: $logToken"
      run: |
          # Encode the command for PowerShell
          ENCODED_SCRIPT=$(echo -n "$PS_CODE" | iconv -t UTF-16LE | base64 -w 0)
          
          # Execute remotely over SSH
          ssh Administrator@192.168.2.252 "powershell -EncodedCommand $ENCODED_SCRIPT"
          
          # Clean up the pulled local data on the Linux orchestrator VM so subsequent runs start completely fresh without old DLL state.
          rm -f ./artifacts/CvGameCoreDLL.dll ./artifacts/CvGameCoreDLL.pdb  ./artifacts/*.log \
            ./build-provenance.txt ./expected-sources.txt ./actual-sources.txt \
           ./source-hashes.diff ./source-verification.txt
